<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>popup</title>
</head>
<body>
    <div class="note_popup" hidden>
        <button type="button" class="cut_note">컷</button>
        <button type="button" class="copy_note">복사</button>
        <button type="button" class="delete_note">삭제</button>
    </div>

    
    <div class="action_popup_wrap" hidden>
        <div class="action_popup">
            <strong class="action_popup_title">
                작업을 저장할까요?
            </strong>

            <p class="action_popup_text">
                현재 작업이 저장됩니다.
            </p>

            <div class="action_popup_buttons"></div>

            <p class="save_complete_message" hidden>
                저장이 완료되었습니다.
            </p>
        </div>
    </div>
</body>
</html>
